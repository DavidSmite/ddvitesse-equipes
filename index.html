<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8B1A1A">
<title>DD Vitesse — Suivi Multi-Équipes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.4}
body{padding-bottom:80px}
.app{max-width:680px;margin:0 auto;background:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:18px;font-weight:700;letter-spacing:1px}
.logo-sub{font-size:11px;opacity:0.7;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:4px}
.tab{flex:1;padding:10px;background:rgba(255,255,255,0.1);border:none;color:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
.tab.active.red{background:#8B1A1A;box-shadow:0 2px 8px rgba(139,26,26,0.5)}
.tab.active.blue{background:#1e4d8b;box-shadow:0 2px 8px rgba(30,77,139,0.5)}
.toolbar{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.tool-btn{padding:6px 10px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;font-size:11px;cursor:pointer;transition:all 0.2s;font-weight:500}
.tool-btn:active{transform:scale(0.95);background:rgba(255,255,255,0.3)}
.tool-btn.primary{background:#4CAF50;border-color:#4CAF50}
.tool-btn.danger{background:rgba(244,67,54,0.3);border-color:rgba(244,67,54,0.5)}
.content{padding:20px 16px}
.section-title-bar{background:#8B1A1A;color:#fff;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-weight:700;font-size:14px;letter-spacing:0.5px}
.section-title-bar.blue{background:#1e4d8b}
.fiche-header{background:#8B1A1A;color:#fff;padding:14px 18px;border-radius:10px;margin-bottom:20px}
.fiche-header.blue{background:#1e4d8b}
.fiche-header h2{font-size:16px;font-weight:700;letter-spacing:1px}
.fiche-header p{font-size:12px;opacity:0.85;margin-top:4px}
.team-selector{background:#fff;border:2px solid #e0e0e0;border-radius:10px;padding:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.team-selector-label{font-size:11px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.team-count{background:#8B1A1A;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px}
.team-selector.blue-mode .team-count{background:#1e4d8b}
.team-row{display:flex;gap:8px;align-items:center}
.team-dropdown{flex:1;padding:10px 12px;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;font-weight:600;background:#f9f9f9;cursor:pointer}
.team-btn{padding:10px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#8B1A1A;color:#fff;transition:all 0.2s}
.team-btn.blue{background:#1e4d8b}
.team-btn:active{transform:scale(0.95)}
.team-btn.delete{background:#c0392b}
.team-btn.add{background:#4CAF50}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid-1{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.field{display:flex;flex-direction:column}
.field-label{font-size:11px;color:#555;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.field input,.field select,.field textarea{padding:12px 14px;border:1px solid #d0d0d0;border-radius:10px;font-size:15px;background:#fafafa;transition:all 0.2s;font-family:inherit;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#8B1A1A;background:#fff;box-shadow:0 0 0 3px rgba(139,26,26,0.1)}
.blue-focus input:focus,.blue-focus select:focus,.blue-focus textarea:focus{border-color:#1e4d8b;box-shadow:0 0 0 3px rgba(30,77,139,0.1)}
.field textarea{resize:vertical;min-height:60px}
.ref-block{background:#f9f9f9;border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:12px}
.ref-title{font-size:13px;font-weight:700;color:#8B1A1A;margin-bottom:10px}
.blue-mode .ref-title{color:#1e4d8b}
.radio-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.radio-label{font-size:12px;color:#666;font-weight:600}
.radio-btn{padding:6px 14px;border:1px solid #d0d0d0;background:#fff;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s}
.radio-btn.active{background:#8B1A1A;color:#fff;border-color:#8B1A1A}
.blue-mode .radio-btn.active{background:#1e4d8b;border-color:#1e4d8b}
.rep-card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:10px;transition:all 0.2s}
.rep-card.alert{border-color:#ff6b35;background:#fff5f0}
.rep-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rep-number{font-size:14px;font-weight:700;color:#8B1A1A}
.blue-mode .rep-number{color:#1e4d8b}
.rep-badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700}
.badge-stable{background:#4CAF50;color:#fff}
.badge-warning{background:#ff9800;color:#fff}
.badge-stop{background:#f44336;color:#fff}
.rpe-picker{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rpe-btn{flex:1;min-width:28px;padding:8px 4px;border:1px solid #d0d0d0;background:#fff;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.rpe-btn.active{background:#8B1A1A;color:#fff;border-color:#8B1A1A;transform:scale(1.05)}
.blue-mode .rpe-btn.active{background:#1e4d8b;border-color:#1e4d8b}
.rpe-label{font-size:10px;color:#888;text-align:center;margin-top:4px;min-height:12px}
.star-row{display:flex;gap:4px;justify-content:center;margin-top:8px}
.star{font-size:28px;color:#ddd;cursor:pointer;transition:all 0.15s}
.star.filled{color:#ffc107}
.pap-box{background:#fff8e1;border:1px solid #ffc107;border-radius:10px;padding:12px;margin-bottom:12px}
.pap-result{font-size:12px;font-weight:600;margin-top:8px;padding:8px;border-radius:6px;text-align:center}
.pap-green{background:#c8e6c9;color:#2e7d32}
.pap-orange{background:#ffe0b2;color:#e65100}
.pap-red{background:#ffcdd2;color:#c62828}
.section-divider{height:1px;background:#e0e0e0;margin:24px 0}
.stop-signal{background:#f44336;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:700;margin:12px 0;display:none;animation:pulse 1s infinite}
.stop-signal.visible{display:block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.85}}
.info-box{background:#e3f2fd;border-left:4px solid #1e4d8b;padding:10px 14px;border-radius:4px;font-size:12px;color:#1565c0;margin-bottom:12px}
.info-box.red{background:#ffebee;border-color:#c62828;color:#b71c1c}
.quality-header{font-size:13px;font-weight:600;color:#555;text-align:center;margin-bottom:4px}
.field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:200;max-width:90%;text-align:center}
.toast.show{opacity:1}
.no-team{text-align:center;padding:40px 20px;color:#888}
.no-team-icon{font-size:48px;margin-bottom:16px;opacity:0.3}
@media(max-width:480px){
  .content{padding:16px 12px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="logo">DD VITESSE</div>
        <div class="logo-sub">FFDDJR · Suivi multi-équipes</div>
      </div>
      <div style="font-size:11px;opacity:0.7;text-align:right">
        <div id="currentDate"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active red" id="tab15s" onclick="switchMode('15s')">REPS 15s</button>
      <button class="tab" id="tab68s" onclick="switchMode('68s')">SPEED MAX</button>
    </div>
    <div class="toolbar">
      <button class="tool-btn primary" onclick="saveNow()">💾 Sauvegarder</button>
      <button class="tool-btn" onclick="loadSaved()">📂 Charger</button>
      <button class="tool-btn" onclick="exportAll()">📤 Exporter</button>
      <button class="tool-btn danger" onclick="newSession()">🔄 Nouvelle</button>
    </div>
  </div>

  <div class="content" id="content">
    <!-- Infos générales communes -->
    <div class="section-title-bar" id="commonBar">INFOS GÉNÉRALES</div>
    <div class="grid">
      <div class="field">
        <label class="field-label">Date</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label class="field-label">Semaine</label>
        <input type="text" id="semaine" placeholder="S1, S2…">
      </div>
    </div>
    <div class="grid-1">
      <div class="field">
        <label class="field-label">Phase</label>
        <input type="text" id="phase" placeholder="Reprise / Développement / Surcharge / Récupération">
      </div>
    </div>

    <div class="section-divider"></div>

    <!-- Sélecteur d'équipe -->
    <div class="team-selector" id="teamSelector">
      <div class="team-selector-label">
        <span>ÉQUIPE ACTIVE</span>
        <span class="team-count" id="teamCount">0 équipes</span>
      </div>
      <div class="team-row">
        <select class="team-dropdown" id="teamDropdown" onchange="selectTeam(this.value)">
          <option value="">— Sélectionner —</option>
        </select>
        <button class="team-btn add" onclick="addTeam()">+ Équipe</button>
      </div>
    </div>

    <div id="teamContent">
      <div class="no-team">
        <div class="no-team-icon">👥</div>
        <p><strong>Aucune équipe</strong></p>
        <p style="font-size:13px;margin-top:8px">Clique sur <strong>+ Équipe</strong> pour commencer</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='ddvitesse_multiteam_v1';
let state={
  mode:'15s',
  date:new Date().toISOString().slice(0,10),
  semaine:'',
  phase:'',
  activeTeamId:null,
  teams:[]
};

const RPE_LABELS={
  0:'Aucun',1:'Très très léger',2:'Très léger',3:'Léger',4:'Modéré',
  5:'Fort',6:'Entre fort et très fort',7:'Très fort',8:'Entre 7 et 9',
  9:'Extrêmement fort',10:'Maximal absolu'
};

// INIT
window.addEventListener('DOMContentLoaded',()=>{
  displayDate();
  tryLoadOnStart();
  render();
  // Auto-save every 30s
  setInterval(()=>{saveNow(true)},30000);
});

function displayDate(){
  const d=new Date();
  document.getElementById('currentDate').textContent=d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
}

function switchMode(mode){
  state.mode=mode;
  document.getElementById('tab15s').classList.toggle('active',mode==='15s');
  document.getElementById('tab15s').classList.toggle('red',mode==='15s');
  document.getElementById('tab68s').classList.toggle('active',mode==='68s');
  document.getElementById('tab68s').classList.toggle('blue',mode==='68s');
  const commonBar=document.getElementById('commonBar');
  commonBar.classList.toggle('blue',mode==='68s');
  const selector=document.getElementById('teamSelector');
  selector.classList.toggle('blue-mode',mode==='68s');
  render();
}

function newTeam(){
  return {
    id:Date.now()+Math.random(),
    nom:'',
    athletes:'',
    ref15s:{actuelle:'',precedente:'',reeval:'non'},
    ref30s:{actuelle:'',precedente:'',reeval:'non'},
    ref1mn:{actuelle:'',precedente:'',reeval:'non'},
    ref68s:{actuelle:'',precedente:'',reeval:'non'},
    prescription15s:{intensite:'',cible:'',nbReps:'6',repos:'3-4 min',focus:''},
    prescription68s:{intensite:'100%',cible:'',nbReps:'5',repos:'4 min',focus:''},
    reps15s:Array.from({length:6},()=>({resultat:'',rpe:null,tronc:'',arrets:'',hPercu:'',note:''})),
    reps68s:Array.from({length:6},()=>({resultat:'',rpe:null,note:''})),
    bilan15s:{qualite:0,decision:'',notes:''},
    bilan68s:{qualite:0,decision:'',notes:''}
  };
}

function addTeam(){
  if(state.teams.length>=10){showToast('Maximum 10 équipes');return}
  const team=newTeam();
  team.nom='Équipe '+(state.teams.length+1);
  state.teams.push(team);
  state.activeTeamId=team.id;
  saveNow(true);
  render();
  showToast('✓ Équipe ajoutée');
}

function deleteTeam(){
  if(!state.activeTeamId)return;
  const team=getActiveTeam();
  if(!confirm(`Supprimer "${team.nom}" ? Cette action est irréversible.`))return;
  state.teams=state.teams.filter(t=>t.id!==state.activeTeamId);
  state.activeTeamId=state.teams.length>0?state.teams[0].id:null;
  saveNow(true);
  render();
  showToast('Équipe supprimée');
}

function selectTeam(id){
  state.activeTeamId=id?parseFloat(id):null;
  render();
}

function getActiveTeam(){
  return state.teams.find(t=>t.id===state.activeTeamId);
}

function updateCommon(){
  state.date=document.getElementById('date').value;
  state.semaine=document.getElementById('semaine').value;
  state.phase=document.getElementById('phase').value;
}

function updateTeamField(field,value){
  const t=getActiveTeam();if(!t)return;
  const parts=field.split('.');
  if(parts.length===1){t[parts[0]]=value}
  else if(parts.length===2){t[parts[0]][parts[1]]=value}
  else if(parts.length===3){t[parts[0]][parts[1]][parts[2]]=value}
}

function updateRep(mode,idx,field,value){
  const t=getActiveTeam();if(!t)return;
  const repsKey=mode==='15s'?'reps15s':'reps68s';
  t[repsKey][idx][field]=value;
  // Re-render rep badges
  renderRepBadges();
}

function setRPE(mode,idx,val){
  const t=getActiveTeam();if(!t)return;
  const repsKey=mode==='15s'?'reps15s':'reps68s';
  t[repsKey][idx].rpe=val;
  // Update the label visually
  document.getElementById(`rpeLabel_${mode}_${idx}`).textContent=`RPE ${val} — ${RPE_LABELS[val]}`;
  // Update buttons
  for(let i=0;i<=10;i++){
    const btn=document.getElementById(`rpe_${mode}_${idx}_${i}`);
    if(btn)btn.classList.toggle('active',i===val);
  }
}

function setRadio(field,value){
  updateTeamField(field,value);
  // Update buttons
  const parts=field.split('.');
  const btnPrefix=`radio_${parts.join('_')}`;
  document.querySelectorAll(`[id^="${btnPrefix}_"]`).forEach(b=>b.classList.remove('active'));
  document.getElementById(`${btnPrefix}_${value}`).classList.add('active');
}

function setStars(bilanKey,val){
  const t=getActiveTeam();if(!t)return;
  t[bilanKey].qualite=val;
  const stars=document.querySelectorAll(`.star-${bilanKey}`);
  stars.forEach((s,i)=>s.classList.toggle('filled',i<val));
}

function renderRepBadges(){
  const t=getActiveTeam();if(!t)return;
  const mode=state.mode;
  const repsKey=mode==='15s'?'reps15s':'reps68s';
  const reps=t[repsKey];
  let ref=0;
  if(mode==='15s'){
    ref=parseFloat(t.ref15s.actuelle)||0;
  }else{
    ref=parseFloat(t.ref68s.actuelle)||0;
  }
  let stopTriggered=false;
  reps.forEach((r,i)=>{
    const card=document.getElementById(`repCard_${mode}_${i}`);
    const badge=document.getElementById(`repBadge_${mode}_${i}`);
    if(!card||!badge)return;
    const val=parseFloat(r.resultat)||0;
    if(!val){
      badge.textContent='—';
      badge.className='rep-badge';
      card.classList.remove('alert');
      return;
    }
    if(mode==='68s'){
      // Speed Max : alert if drop > 2 pas from ref
      if(ref>0 && (ref-val)>2){
        badge.textContent='⛔ ARRÊT';
        badge.className='rep-badge badge-stop';
        card.classList.add('alert');
        stopTriggered=true;
      }else if(ref>0 && (ref-val)>0){
        badge.textContent='⚠ -'+(ref-val).toFixed(1);
        badge.className='rep-badge badge-warning';
        card.classList.add('alert');
      }else{
        badge.textContent='✓ Stable';
        badge.className='rep-badge badge-stable';
        card.classList.remove('alert');
      }
    }else{
      // 15s : compare to previous rep
      if(i===0){
        badge.textContent='Baseline';
        badge.className='rep-badge badge-stable';
        card.classList.remove('alert');
      }else{
        const prev=parseFloat(reps[i-1].resultat)||0;
        if(prev>0 && (prev-val)>2){
          badge.textContent='⚠ Chute';
          badge.className='rep-badge badge-warning';
          card.classList.add('alert');
        }else if(prev>0 && val>=prev){
          badge.textContent='↑ PAP';
          badge.className='rep-badge badge-stable';
          card.classList.remove('alert');
        }else{
          badge.textContent='Stable';
          badge.className='rep-badge badge-stable';
          card.classList.remove('alert');
        }
      }
    }
  });
  // Stop signal
  const stopEl=document.getElementById('stopSignal_'+mode);
  if(stopEl)stopEl.classList.toggle('visible',stopTriggered);
  // PAP analysis
  renderPAP();
}

function renderPAP(){
  const t=getActiveTeam();if(!t)return;
  const mode=state.mode;
  const repsKey=mode==='15s'?'reps15s':'reps68s';
  const reps=t[repsKey];
  const papBox=document.getElementById('papBox_'+mode);
  if(!papBox)return;
  const vals=reps.map(r=>parseFloat(r.resultat)||0).filter(v=>v>0);
  if(vals.length<2){
    papBox.innerHTML='<strong>📊 Analyse PAP</strong><p style="font-size:12px;color:#888;margin-top:6px">Remplir au moins 2 reps pour analyser</p>';
    return;
  }
  const baseline=vals[0];
  const peak=Math.max(...vals);
  const peakIdx=vals.indexOf(peak);
  const ecart=peak-baseline;
  let verdict='',cls='';
  if(mode==='15s'){
    if(ecart>=3 && peakIdx>=2){verdict='PAP normal — montée en puissance neuromusculaire';cls='pap-green'}
    else if(ecart>=5){verdict='Pic élevé — référence max probablement à réévaluer ↑';cls='pap-orange'}
    else if(peak<baseline){verdict='Dégradation — fatigue précoce, repos à augmenter';cls='pap-red'}
    else{verdict='Profil plat — stimulus cohérent';cls='pap-green'}
  }else{
    const chutes=vals.filter(v=>(baseline-v)>2).length;
    if(chutes>0){verdict='Chute détectée — arrêt recommandé';cls='pap-red'}
    else if(peak>baseline){verdict='Plafond neurologique atteint — excellent';cls='pap-green'}
    else{verdict='Performance stable — protocole correct';cls='pap-green'}
  }
  papBox.innerHTML=`
    <strong>📊 Analyse PAP</strong>
    <p style="font-size:12px;margin-top:6px">Baseline (rep 1) : <strong>${baseline}</strong> pas · Pic : <strong>${peak}</strong> pas (rep ${peakIdx+1}) · Écart : <strong>${ecart>=0?'+':''}${ecart}</strong></p>
    <div class="pap-result ${cls}">${verdict}</div>
  `;
}

function render(){
  // Update common fields
  document.getElementById('date').value=state.date;
  document.getElementById('semaine').value=state.semaine;
  document.getElementById('phase').value=state.phase;
  document.getElementById('date').onchange=updateCommon;
  document.getElementById('semaine').oninput=updateCommon;
  document.getElementById('phase').oninput=updateCommon;

  // Team count
  document.getElementById('teamCount').textContent=state.teams.length+' équipe'+(state.teams.length>1?'s':'');

  // Team dropdown
  const dd=document.getElementById('teamDropdown');
  dd.innerHTML='<option value="">— Sélectionner —</option>';
  state.teams.forEach(t=>{
    const opt=document.createElement('option');
    opt.value=t.id;
    opt.textContent=t.nom||'Équipe sans nom';
    if(t.id===state.activeTeamId)opt.selected=true;
    dd.appendChild(opt);
  });

  // Content
  const container=document.getElementById('teamContent');
  if(state.teams.length===0){
    container.innerHTML=`
      <div class="no-team">
        <div class="no-team-icon">👥</div>
        <p><strong>Aucune équipe</strong></p>
        <p style="font-size:13px;margin-top:8px">Clique sur <strong>+ Équipe</strong> pour commencer</p>
      </div>
    `;
    return;
  }

  if(!state.activeTeamId && state.teams.length>0){
    state.activeTeamId=state.teams[0].id;
  }

  const t=getActiveTeam();
  if(!t){container.innerHTML='';return}

  if(state.mode==='15s'){
    container.innerHTML=renderFiche15s(t);
  }else{
    container.innerHTML=renderFiche68s(t);
  }

  // Attach handlers
  attachHandlers();
  renderRepBadges();
}

function renderFiche15s(t){
  const hMode=state.mode==='68s'?'blue-mode':'';
  return `
    <div class="fiche-header">
      <h2>REPS 15 SECONDES</h2>
      <p>Vitesse pure · Glycolyse · FFDDJR 2026</p>
    </div>

    <div class="grid">
      <div class="field">
        <label class="field-label">Nom équipe / club</label>

function renderRefBlock(key,label,ref,blueMode=false){
  const mode=blueMode?'blue-mode':'';
  const fcls=blueMode?'blue-focus':'';
  return `
    <div class="ref-block ${mode}">
      <div class="ref-title">${label}</div>
      <div class="grid">
        <div class="field ${fcls}">
          <label class="field-label">Actuelle</label>
          <input type="number" id="ref${key}_actuelle" value="${ref.actuelle}" placeholder="pas">
        </div>
        <div class="field ${fcls}">
          <label class="field-label">Précédente</label>
          <input type="number" id="ref${key}_precedente" value="${ref.precedente}" placeholder="pas">
        </div>
      </div>
      <div class="radio-row">
        <span class="radio-label">Réévaluation :</span>
        <button class="radio-btn ${ref.reeval==='oui'?'active':''}" id="radio_ref${key}_reeval_oui" onclick="setRadio('ref${key}.reeval','oui')">OUI</button>
        <button class="radio-btn ${ref.reeval==='non'?'active':''}" id="radio_ref${key}_reeval_non" onclick="setRadio('ref${key}.reeval','non')">NON</button>
      </div>
    </div>
  `;
}

function renderPrescription(mode,p,blueMode=false){
  const fcls=blueMode?'blue-focus':'';
  return `
    <div class="field ${fcls}">
      <label class="field-label">Intensité (%)</label>
      <input type="text" id="presc${mode}_intensite" value="${escapeHtml(p.intensite)}" placeholder="90-95%">
    </div>
    <div class="field ${fcls}" style="margin-top:12px">
      <label class="field-label">Cible en pas</label>
      <input type="number" id="presc${mode}_cible" value="${p.cible}" placeholder="pas">
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="field ${fcls}">
        <label class="field-label">Nb reps</label>
        <input type="number" id="presc${mode}_nbReps" value="${p.nbReps}" min="1" max="10">
      </div>
      <div class="field ${fcls}">
        <label class="field-label">Repos</label>
        <input type="text" id="presc${mode}_repos" value="${escapeHtml(p.repos)}" placeholder="3-4 min">
      </div>
    </div>
    <div class="field ${fcls}" style="margin-top:12px">
      <label class="field-label">Focus technique</label>
      <textarea id="presc${mode}_focus" placeholder="Tronc horizontal, pose d'avant-pied…">${escapeHtml(p.focus)}</textarea>
    </div>
  `;
}

function attachHandlers(){
  const t=getActiveTeam();if(!t)return;
  const mode=state.mode;

  // Nom et athlètes
  const nomEl=document.getElementById('team_nom');
  if(nomEl)nomEl.oninput=(e)=>{t.nom=e.target.value;document.getElementById('teamDropdown').querySelector(`option[value="${t.id}"]`).textContent=e.target.value||'Équipe sans nom'};
  const athEl=document.getElementById('team_athletes');
  if(athEl)athEl.oninput=(e)=>{t.athletes=e.target.value};

  // Références
  ['15s','30s','1mn','68s'].forEach(k=>{
    const refKey='ref'+k;
    if(!t[refKey])return;
    const aEl=document.getElementById(`${refKey}_actuelle`);
    const pEl=document.getElementById(`${refKey}_precedente`);
    if(aEl)aEl.oninput=(e)=>{t[refKey].actuelle=e.target.value;renderRepBadges()};
    if(pEl)pEl.oninput=(e)=>{t[refKey].precedente=e.target.value};
  });

  // Prescription
  const pKey='prescription'+mode;
  ['intensite','cible','nbReps','repos','focus'].forEach(f=>{
    const el=document.getElementById(`presc${mode}_${f}`);
    if(el)el.oninput=(e)=>{t[pKey][f]=e.target.value};
  });

  // Reps
  const repsKey=mode==='15s'?'reps15s':'reps68s';
  t[repsKey].forEach((r,i)=>{
    const fields=mode==='15s'?['resultat','tronc','arrets','hPercu','note']:['resultat','note'];
    fields.forEach(f=>{
      const el=document.getElementById(`rep${mode}_${i}_${f}`);
      if(el)el.oninput=(e)=>{updateRep(mode,i,f,e.target.value)};
    });
  });

  // Bilan
  const bKey='bilan'+mode;
  const dEl=document.getElementById(`${bKey}_decision`);
  if(dEl)dEl.oninput=(e)=>{t[bKey].decision=e.target.value};
  const nEl=document.getElementById(`${bKey}_notes`);
  if(nEl)nEl.oninput=(e)=>{t[bKey].notes=e.target.value};
}

function renameTeam(){
  const t=getActiveTeam();if(!t)return;
  const nv=prompt('Nouveau nom de l\'équipe :',t.nom);
  if(nv!==null){t.nom=nv;saveNow(true);render()}
}

function escapeHtml(s){
  if(s===null||s===undefined)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// SAVE / LOAD
function saveNow(silent=false){
  try{
    const data={...state,savedAt:new Date().toISOString()};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    if(!silent)showToast('✓ Séance sauvegardée');
  }catch(e){
    if(!silent)showToast('Erreur sauvegarde');
  }
}

function tryLoadOnStart(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    const savedAt=new Date(data.savedAt);
    const now=new Date();
    const hours=(now-savedAt)/(1000*60*60);
    if(hours<24){
      if(confirm(`Une séance a été sauvegardée il y a ${Math.round(hours*10)/10}h. La charger ?`)){
        Object.assign(state,data);
        delete state.savedAt;
      }
    }
  }catch(e){}
}

function loadSaved(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw){showToast('Aucune sauvegarde trouvée');return}
    const data=JSON.parse(raw);
    Object.assign(state,data);
    delete state.savedAt;
    render();
    showToast('✓ Séance chargée');
  }catch(e){showToast('Erreur chargement')}
}

function newSession(){
  if(!confirm('Créer une nouvelle séance ? Les données actuelles seront perdues si non sauvegardées.'))return;
  state={
    mode:state.mode,
    date:new Date().toISOString().slice(0,10),
    semaine:'',
    phase:'',
    activeTeamId:null,
    teams:[]
  };
  localStorage.removeItem(STORAGE_KEY);
  render();
  showToast('Nouvelle séance');
}

function exportAll(){
  let txt=`DD VITESSE — SUIVI DE SÉANCE\n`;
  txt+=`${'='.repeat(50)}\n\n`;
  txt+=`Date : ${state.date}\n`;
  txt+=`Semaine : ${state.semaine}\n`;
  txt+=`Phase : ${state.phase}\n`;
  txt+=`Mode : ${state.mode==='15s'?'REPS 15s':'SPEED MAX 6-8s'}\n`;
  txt+=`Équipes : ${state.teams.length}\n\n`;
  state.teams.forEach((t,idx)=>{
    txt+=`${'─'.repeat(50)}\n`;
    txt+=`ÉQUIPE ${idx+1} : ${t.nom}\n`;
    txt+=`${'─'.repeat(50)}\n`;
    txt+=`Athlètes : ${t.athletes}\n\n`;
    txt+=`RÉFÉRENCES MAX :\n`;
    txt+=`  15s : ${t.ref15s.actuelle} (précédent ${t.ref15s.precedente})${t.ref15s.reeval==='oui'?' [réévalué]':''}\n`;
    txt+=`  30s : ${t.ref30s.actuelle} (précédent ${t.ref30s.precedente})${t.ref30s.reeval==='oui'?' [réévalué]':''}\n`;
    txt+=`  1mn : ${t.ref1mn.actuelle} (précédent ${t.ref1mn.precedente})${t.ref1mn.reeval==='oui'?' [réévalué]':''}\n`;
    if(state.mode==='68s')txt+=`  6-8s : ${t.ref68s.actuelle} (précédent ${t.ref68s.precedente})${t.ref68s.reeval==='oui'?' [réévalué]':''}\n`;
    txt+=`\n`;
    if(state.mode==='15s'){
      txt+=`PRESCRIPTION :\n`;
      txt+=`  Intensité ${t.prescription15s.intensite} · Cible ${t.prescription15s.cible} pas · ${t.prescription15s.nbReps} reps · Repos ${t.prescription15s.repos}\n`;
      txt+=`  Focus : ${t.prescription15s.focus}\n\n`;
      txt+=`RÉSULTATS REPS 15s :\n`;
      t.reps15s.forEach((r,i)=>{
        if(r.resultat||r.rpe!==null){
          txt+=`  Rep ${i+1} : ${r.resultat||'—'} pas | RPE ${r.rpe??'—'} | Tronc ${r.tronc||'—'} | Arrêts ${r.arrets||0} | H⁺ ${r.hPercu||'—'}\n`;
          if(r.note)txt+=`    Note : ${r.note}\n`;
        }
      });
      txt+=`\nBILAN : ${'★'.repeat(t.bilan15s.qualite)}${'☆'.repeat(5-t.bilan15s.qualite)}\n`;
      if(t.bilan15s.decision)txt+=`Décision : ${t.bilan15s.decision}\n`;
      if(t.bilan15s.notes)txt+=`Notes : ${t.bilan15s.notes}\n`;
    }else{
      txt+=`PRESCRIPTION SPEED MAX :\n`;
      txt+=`  Intensité ${t.prescription68s.intensite} · Cible ${t.prescription68s.cible} pas · ${t.prescription68s.nbReps} reps · Repos ${t.prescription68s.repos}\n`;
      txt+=`  Focus : ${t.prescription68s.focus}\n\n`;
      txt+=`RÉSULTATS SPEED MAX 6-8s :\n`;
      t.reps68s.forEach((r,i)=>{
        if(r.resultat||r.rpe!==null){
          txt+=`  Rep ${i+1} : ${r.resultat||'—'} pas | RPE ${r.rpe??'—'}\n`;
          if(r.note)txt+=`    Note : ${r.note}\n`;
        }
      });
      txt+=`\nBILAN : ${'★'.repeat(t.bilan68s.qualite)}${'☆'.repeat(5-t.bilan68s.qualite)}\n`;
      if(t.bilan68s.decision)txt+=`Décision : ${t.bilan68s.decision}\n`;
      if(t.bilan68s.notes)txt+=`Notes : ${t.bilan68s.notes}\n`;
    }
    txt+=`\n`;
  });
  txt+=`${'='.repeat(50)}\n`;
  txt+=`Généré le ${new Date().toLocaleString('fr-FR')}\n`;
  txt+=`DD Vitesse — FFDDJR 2026\n`;

  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`DDVitesse_${state.date}_${state.mode}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Export téléchargé');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
